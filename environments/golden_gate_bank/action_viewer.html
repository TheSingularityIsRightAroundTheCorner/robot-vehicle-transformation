<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Gate · Robot Flight</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1a24;color:#deecee;font:14px system-ui}header,footer{display:flex;flex-wrap:wrap;gap:12px;padding:16px 22px;align-items:center}header{border-bottom:1px solid #35515d}b{letter-spacing:.12em;font-size:12px}small{color:#93aeb7}select,button,input[type=number]{background:#19303c;color:#e0edef;border:1px solid #476775;border-radius:4px;padding:7px;font:inherit;max-width:100%}input[type=number]{width:72px}label{display:inline-flex;align-items:center;gap:5px;font-size:12px}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;height:auto}footer input{flex:1;min-width:130px}aside{padding:0 22px 18px;color:#92adb8}.capture header,.capture footer,.capture aside{display:none}.capture main{max-width:none}</style></head><body>
<header><div><b>GOLDEN GATE / ROBOT FLIGHT</b><br><small>Shared scene · Procedural sea split</small></div><select id="shot" aria-label="Action shot"><option value="op_final">OP final / Dawn</option><option value="hero_hover">Hero hover / Sunset</option></select><select id="layer" aria-label="Render layer"><option value="beauty">Beauty</option><option value="robot">Robot / alpha</option><option value="wake">Wake / alpha</option><option value="environment">Environment</option><option value="bridge">Bridge / alpha</option></select><button id="play">Play</button><button id="save">Save PNG</button><label>Robot scale <input id="scale" aria-label="Robot scale" type="number" min="1" max="8" step=".25" value="4"></label><label>Forward lean <input id="lean" aria-label="Forward lean" type="number" min="0" max="85" step="5" value="45"></label><label>Speed <input id="speed" aria-label="Flight speed" type="number" min=".25" max="2" step=".25" value="1"></label><label>Trench width <input id="width" aria-label="Trench width" type="number" min="10" max="220" step="5" value="90"></label><label>Depth <input id="depth" aria-label="Trench depth" type="number" min="1" max="45" step="1" value="14"></label><label>Spray height <input id="height" aria-label="Spray height" type="number" min="1" max="100" step="2" value="26"></label></header>
<main id="stage"></main><footer><input id="time" aria-label="Shot time" type="range" min="0" max="6" step="0.0416666667" value="0"><output id="stamp">0.00 s</output></footer><aside>Original robot design and motion rig. One Three.js scene and depth buffer; bridge cables occlude the robot in beauty renders. Export passes are isolated assets. Helmet redesign remains with the artist.</aside>
<script src="vendor/three.min.js"></script><script src="lighting_profiles.js"></script><script src="bridge_scene.js"></script><script src="robot/antigravity_king.js"></script><script src="robot/motion_rig.js"></script><script src="sea_split_wake.js"></script><script src="action_scene.js"></script><script>
THREE.ColorManagement.legacyMode=false;const bank=GoldenGateBank.build(),action=GoldenGateAction.build(bank),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1600,900,false);renderer.setClearColor(0,0);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.getElementById('stage').appendChild(renderer.domElement);
const $=id=>document.getElementById(id);let playing=false,clock=0,last=0;
function render(shot,time,width=1600,height=900,layer='beauty'){const m=action.sample(shot,time);action.setLayer(layer);renderer.setSize(width,height,false);bank.camera.aspect=width/height;bank.camera.updateProjectionMatrix();renderer.render(bank.scene,bank.camera);return {...m,layer,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
function draw(){$('time').max=action.shots[$('shot').value].duration;$('time').value=clock;$('stamp').value=clock.toFixed(2)+' s';render($('shot').value,clock,1600,900,$('layer').value);}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};$('time').oninput=e=>{playing=false;clock=+e.target.value;draw();};$('shot').onchange=()=>{clock=0;draw();};$('layer').onchange=draw;
for(const id of ['scale','lean','speed','width','depth','height'])$(id).onchange=()=>{action.setParams({robotScale:+$('scale').value,flightLean:+$('lean').value,speed:+$('speed').value,width:+$('width').value,depth:+$('depth').value,sprayHeight:+$('height').value});draw();};
$('save').onclick=()=>{render($('shot').value,clock,1920,1080,$('layer').value);const a=document.createElement('a');a.download='golden_gate_'+$('shot').value+'_'+$('layer').value+'_'+clock.toFixed(3)+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click();draw();};
function tick(t){if(playing){clock=(clock+(t-last)/1000)%action.shots[$('shot').value].duration;draw();}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
const q=new URLSearchParams(location.search);if(q.has('capture'))document.body.classList.add('capture');if(action.shots[q.get('shot')])$('shot').value=q.get('shot');clock=Number(q.get('time')||0);draw();window.ActionLab={bank,action,renderer,render,stop:()=>{playing=false;}};
</script></body></html>
