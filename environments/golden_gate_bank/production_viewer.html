<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Environment Banks</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1822;color:#deebee;font:14px system-ui}header,footer{display:flex;flex-wrap:wrap;gap:12px;padding:16px 22px;align-items:center}header{border-bottom:1px solid #35515d}b{letter-spacing:.1em;font-size:12px}select,button{background:#19303c;color:#e0edef;border:1px solid #476775;border-radius:4px;padding:8px;font:inherit;max-width:100%}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;height:auto}footer input{flex:1;min-width:120px}aside{padding:0 22px 20px;color:#92aeba}.capture header,.capture footer,.capture aside{display:none}.capture main{max-width:none}</style></head><body>
<header><b>PRODUCTION / ENVIRONMENT BANKS</b><select id="environment" aria-label="Environment"><option value="space">Space</option><option value="data_center">Data center</option><option value="alcatraz">Alcatraz / Sandbox base</option></select><select id="shot" aria-label="Camera shot"></select><select id="lighting" aria-label="Lighting"></select><button id="play">Play</button><button id="save">Save PNG</button></header><main id="stage"></main><footer><input id="time" aria-label="Shot time" type="range" min="0" max="6" step="0.041666667" value="0"><output id="stamp">0.00 s</output></footer><aside>Procedural production sets. No new character designs. Planet geography and Alcatraz staging are artistic approximations. Use separate character/robot assets for action.</aside>
<script src="vendor/three.min.js"></script><script src="lighting_profiles.js"></script><script src="bridge_scene.js"></script><script src="production_sets.js"></script><script>
THREE.ColorManagement.legacyMode=false;const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setClearColor(0,0);renderer.setSize(1600,900,false);document.getElementById('stage').appendChild(renderer.domElement);const $=id=>document.getElementById(id);let current=null,kind='space',playing=false,clock=0,last=0;
function disposeCurrent(){if(!current)return;const geo=new Set(),mat=new Set();current.scene.traverse(o=>{if(o.geometry)geo.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mat.add(m));});geo.forEach(g=>g.dispose());mat.forEach(m=>m.dispose());renderer.renderLists.dispose();}
function setEnvironment(name){disposeCurrent();kind=name;current=ProductionSets.build(name);$('environment').value=name;$('shot').innerHTML='';for(const name of Object.keys(current.shots))$('shot').add(new Option(name.replaceAll('_',' '),name));$('lighting').innerHTML='';for(const name of current.lightingOptions)$('lighting').add(new Option(name,name));current.setLighting(current.lightingOptions[0]);clock=0;draw();}
function render(shot,time,w=1600,h=900,lighting=null){if(lighting)current.setLighting(lighting);const m=current.sample(shot,time);renderer.setSize(w,h,false);current.camera.aspect=w/h;current.camera.updateProjectionMatrix();renderer.render(current.scene,current.camera);return {...m,environment:kind,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
function draw(){$('time').max=current.shots[$('shot').value].duration;$('time').value=clock;$('stamp').value=clock.toFixed(2)+' s';render($('shot').value,clock,1600,900,$('lighting').value);}
$('environment').onchange=e=>setEnvironment(e.target.value);$('shot').onchange=()=>{clock=0;draw();};$('lighting').onchange=draw;$('time').oninput=e=>{playing=false;clock=+e.target.value;draw();};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};$('save').onclick=()=>{render($('shot').value,clock,1920,1080,$('lighting').value);const a=document.createElement('a');a.download=kind+'_'+$('shot').value+'_'+$('lighting').value+'_'+clock.toFixed(3)+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click();draw();};function tick(t){if(playing){clock=(clock+(t-last)/1000)%current.shots[$('shot').value].duration;draw();}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
const q=new URLSearchParams(location.search);if(q.has('capture'))document.body.classList.add('capture');setEnvironment(['space','data_center','alcatraz'].includes(q.get('environment'))?q.get('environment'):'space');window.ProductionLab={renderer,render,setEnvironment,stop:()=>{playing=false;},get current(){return current;}};
</script></body></html>
