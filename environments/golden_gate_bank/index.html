<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Gate · Bank Scene</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1922;color:#dce7e8;font:14px system-ui}header{padding:18px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #30434b}b{letter-spacing:.12em;font-size:12px}small{color:#8fa7b2}select,button{max-width:100%;font:inherit;color:#e0eceb;border:1px solid #4c6870;background:#1b303b;border-radius:4px;padding:8px}main{max-width:1600px;margin:auto}canvas{width:100%;height:auto;display:block}footer{padding:16px 24px;display:flex;gap:18px;align-items:center}input[type=range]{flex:1}aside{padding:6px 24px 22px;color:#9ab1b6;line-height:1.6}.capture header,.capture footer,.capture aside{display:none}.capture main{max-width:none}</style></head><body>
<header><div><b>GOLDEN GATE</b><br><small>Reusable environment · Camera bank 01</small></div><select id="shot" aria-label="Camera shot"><option value="opening">01 / Opening panorama</option><option value="tower">02 / Tower detail</option><option value="passage">03 / Water-level passage</option><option value="ocean">04 / Ocean departure</option><option value="ending">05 / Closing panorama</option></select><select id="lighting" aria-label="Lighting preset"><option value="day">Day</option><option value="sunset" selected>Sunset</option><option value="night">Night</option><option value="dawn">Dawn</option></select><select id="layer" aria-label="Render layer"><option value="beauty">Full scene</option><option value="bridge">Bridge / alpha</option><option value="environment">Environment only</option></select><button id="play">Play</button><button id="save">Save PNG</button><label><input id="scifi" type="checkbox" checked> SF lights</label></header>
<main id="stage"></main><footer><input id="time" aria-label="Shot time" type="range" min="0" max="6" step="0.0416666667" value="0"><output id="stamp">0.00 s</output></footer><aside>Bridge, ocean, headlands and distant city are procedural geometry. No generated images, downloaded textures or character redesign. The central flight corridor is reserved for Antigravity King; no robot is baked into the bank.</aside>
<script src="vendor/three.min.js"></script><script src="lighting_profiles.js"></script><script src="bridge_scene.js"></script><script>
THREE.ColorManagement.legacyMode=false;
const bank=GoldenGateBank.build(),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1600,900,false);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.;document.getElementById('stage').appendChild(renderer.domElement);
renderer.setClearColor(0x000000,0);let playing=false,clock=0,last=0;const shot=document.getElementById('shot'),slider=document.getElementById('time');
function render(name,time,w=1600,h=900,layer="beauty"){bank.setLayer(layer);renderer.setSize(w,h,false);bank.camera.aspect=w/h;bank.camera.updateProjectionMatrix();let m=bank.sample(name,time);renderer.render(bank.scene,bank.camera);return {...m,width:w,height:h,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
function draw(){slider.max=bank.cameras[shot.value].duration;slider.value=clock;document.getElementById('stamp').value=clock.toFixed(2)+' s';render(shot.value,clock,1600,900,document.getElementById("layer").value);}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';};slider.oninput=()=>{playing=false;clock=+slider.value;draw();};shot.onchange=()=>{clock=0;draw();};document.getElementById('scifi').onchange=e=>{bank.setScifi(e.target.checked);draw();};document.getElementById('lighting').onchange=e=>{bank.setLighting(e.target.value);draw();};document.getElementById('layer').onchange=draw;document.getElementById('save').onclick=()=>{render(shot.value,clock,1920,1080,document.getElementById("layer").value);let a=document.createElement('a');a.download='golden_gate_'+document.getElementById('lighting').value+'_'+shot.value+'_'+document.getElementById('layer').value+'_'+clock.toFixed(3)+'.png';a.href=renderer.domElement.toDataURL('image/png');a.click();draw();};
function tick(t){if(playing){clock=(clock+(t-last)/1000)%bank.cameras[shot.value].duration;draw();}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
const q=new URLSearchParams(location.search);if(q.has('capture'))document.body.classList.add('capture');if(bank.cameras[q.get('shot')])shot.value=q.get('shot');if(BridgeLighting[q.get('lighting')]){document.getElementById('lighting').value=q.get('lighting');bank.setLighting(q.get('lighting'));}clock=Number(q.get('time')||0);draw();
window.BridgeLab={bank,renderer,render,stop:()=>{playing=false;},setScifi:bank.setScifi,setLighting:bank.setLighting};
</script></body></html>
