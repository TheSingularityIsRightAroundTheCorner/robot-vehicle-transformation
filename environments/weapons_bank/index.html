<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Weapon Reference Bank</title><style>
*{box-sizing:border-box}body{margin:0;background:#111d2b;color:#e1eaf2;font:14px system-ui}header,.controls,footer{padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #3b4c60}b{letter-spacing:.08em}small{color:#a3b7c9}select,button{background:#273b50;border:1px solid #546f88;border-radius:4px;padding:8px;color:#eef5fa}label{display:flex;align-items:center;gap:5px}main{max-width:1600px;margin:auto}canvas{display:block;width:100%;height:auto}input[type=range]{width:160px}.capture header,.capture .controls,.capture footer{display:none}.capture main{max-width:none}.hidden{display:none}
</style></head><body><header><b>HERO WEAPON BANK</b><select id="weapon" aria-label="Weapon"></select><select id="state" aria-label="State"></select><select id="view" aria-label="View"><option value="three_quarter">Three quarter</option><option value="front">Front</option><option value="side">Side</option><option value="back">Back / grip</option><option value="top">Top</option><option value="low">Low</option></select><button id="turn">Turntable</button><button id="play">Play state</button></header>
<div class="controls"><select id="stage_color" aria-label="Stage background"><option value="light">Light stage</option><option value="dark">Dark stage</option></select><label>Progress <input id="time" type="range" min="0" max="1" step=".005" value=".65"><output id="time_label">0.65</output></label><select id="layer" aria-label="Render layer"><option value="beauty">Beauty</option><option value="solid">Solid prop only</option><option value="effects">Beams / effects only</option><option value="guide">Scale guide only</option></select><label><input id="outline" type="checkbox" checked> Outline</label><label><input id="flat" type="checkbox"> Flat trace colours</label><label><input id="guide" type="checkbox" checked> Hand / forearm scale</label><label id="beam_controls">Beam <select id="beam"><option value="red">Red</option><option value="yellow">Yellow</option><option value="green">Green</option><option value="blue" selected>Blue</option></select></label><label id="motif_controls"><input id="motif" type="checkbox" checked> Engraved shield face</label><button id="save">Save 1080p transparent PNG</button></div>
<main id="stage"></main><footer><small id="caption"></small><small>Drag to orbit · Wheel to zoom · Same angle and progress across layers · Metre scale</small></footer>
<script src="vendor/three.min.js"></script><script src="weapon_profiles.js?v=ports03"></script><script src="shield_engraving.js"></script><script src="weapon_bank.js?v=ports03"></script><script>
THREE.ColorManagement.legacyMode=false;const T=THREE,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.setSize(1600,900,false);$('stage').appendChild(renderer.domElement);
const cache={},camera=new T.PerspectiveCamera(32,16/9,.01,100),views={front:[0,0],three_quarter:[.60,.22],side:[Math.PI/2,.02],back:[Math.PI,.04],top:[0,Math.PI/2-.01],low:[.42,-.50]};let current,name='gemini',state='twin',view='three_quarter',yaw=.60,pitch=.22,progress=.65,zoom=1,playing=false,turning=false,last=0;
for(const [key,p] of Object.entries(WeaponProfiles))$('weapon').add(new Option(p.label,key));
function selectWeapon(key){if(!cache[key])cache[key]=WeaponsBank.build(key);current=cache[key];name=key;state=current.profile.defaultState;progress=state==='sphere'?1:.65;zoom=1;$('weapon').value=key;$('state').replaceChildren(...current.profile.states.map(s=>new Option(s.replaceAll('_',' '),s)));$('state').value=state;$('beam_controls').classList.toggle('hidden',key!=='gemini');$('motif_controls').classList.toggle('hidden',key!=='gpt');$('caption').textContent=current.profile.label+' · '+current.profile.height.toFixed(2)+' m figure reference';applyControls();}
function applyControls(){current.setOutline($('outline').checked);current.setFlat($('flat').checked);current.setGuide($('guide').checked);current.setLayer($('layer').value);current.setBeamColor($('beam').value);current.setEmblem($('motif').checked);}
function draw(w=1600,h=900,alpha=false){const frame=current.sample(state,progress),target=new T.Vector3(...frame.target);camera.aspect=w/h;camera.position.copy(target).add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(frame.span/(2*Math.tan(16*Math.PI/180))*zoom));camera.lookAt(target);camera.updateProjectionMatrix();camera.updateMatrixWorld();renderer.setSize(w,h,false);renderer.setClearColor($('stage_color').value==='dark'?0x142a3c:0xe4eaf0,alpha?0:1);renderer.render(current.scene,camera);$('time').value=progress;$('time_label').value=progress.toFixed(2);}
function render(c={}){if(c.weapon&&name!==c.weapon)selectWeapon(c.weapon);if(c.state){state=c.state;$('state').value=state;}if(c.progress!==undefined)progress=c.progress;if(c.view){view=c.view;[yaw,pitch]=views[view];$('view').value=view;}if(c.yaw!==undefined)yaw=c.yaw;if(c.zoom!==undefined)zoom=c.zoom;if(c.layer){$('layer').value=c.layer;current.setLayer(c.layer);}if(c.flat!==undefined){$('flat').checked=c.flat;current.setFlat(c.flat);}if(c.outline!==undefined){$('outline').checked=c.outline;current.setOutline(c.outline);}if(c.guide!==undefined){$('guide').checked=c.guide;current.setGuide(c.guide);}if(c.stage)$('stage_color').value=c.stage;if(c.beam){$('beam').value=c.beam;current.setBeamColor(c.beam);}draw(c.width||1600,c.height||900,c.alpha||false);return {weapon:name,state,progress,view,layer:current.getLayer(),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
$('weapon').onchange=e=>{selectWeapon(e.target.value);draw();};$('state').onchange=e=>{state=e.target.value;progress=state==='sphere'?1:.65;draw();};$('view').onchange=e=>{view=e.target.value;[yaw,pitch]=views[view];zoom=1;draw();};$('time').oninput=e=>{progress=+e.target.value;draw();};for(const id of ['layer','outline','flat','guide','beam','motif','stage_color'])$(id).onchange=()=>{applyControls();draw();};$('turn').onclick=()=>{turning=!turning;$('turn').textContent=turning?'Stop turn':'Turntable';};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play state';};
$('save').onclick=async()=>{draw(1920,1080,true);const b=await new Promise(r=>renderer.domElement.toBlob(r)),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name+'_'+state+'_'+view+'_'+current.getLayer()+(name==='gemini'?'_'+$('beam').value:'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);draw();};let dragging=false,point;renderer.domElement.onpointerdown=e=>{dragging=true;point=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!dragging)return;yaw-=(e.clientX-point[0])*.008;pitch=T.MathUtils.clamp(pitch+(e.clientY-point[1])*.006,-1.55,1.55);point=[e.clientX,e.clientY];draw();};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onwheel=e=>{e.preventDefault();zoom=T.MathUtils.clamp(zoom*Math.exp(e.deltaY*.001),.45,2);draw();};function tick(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(playing)progress=(progress+dt*.18)%1;if(turning)yaw+=dt*.38;if(playing||turning)draw();requestAnimationFrame(tick);}if(params.has('capture'))document.body.classList.add('capture');selectWeapon(WeaponProfiles[params.get('weapon')]?params.get('weapon'):'gemini');if(current.profile.states.includes(params.get('state')))state=params.get('state');$('state').value=state;if(state==='sphere')progress=1;if(views[params.get('view')]){view=params.get('view');[yaw,pitch]=views[view];}draw();requestAnimationFrame(tick);window.WeaponsLab={render,renderer,camera,get current(){return current;},stop:()=>{playing=false;turning=false;}};
</script></body></html>
